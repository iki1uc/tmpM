}
:root {
  --bg: #f3efe6;
  --surface: #fffdf6;
  --surface-2: #ece5d5;
  --ink: #201a13;
  --muted: #6f6353;
  --line: #d8cfba;
  --primary: #b45309;
  --primary-ink: #fff8ec;
  --accent: #0f766e;
  --glow: rgba(180, 83, 9, 0.55);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131009;
    --surface: #1e1912;
    --surface-2: #2a2317;
    --ink: #f3ecdc;
    --muted: #ab9f88;
    --line: #3d3423;
    --primary: #f59e0b;
    --primary-ink: #221806;
    --accent: #2dd4bf;
    --glow: rgba(245, 158, 11, 0.6);
  }
}
html {
  background: var(--bg);
}
body {
  font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
.mono {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
.cell-btn {
  transition: opacity 120ms ease, outline-color 120ms ease, transform 120ms ease;
}
.cell-btn:hover {
  transform: scale(1.12);
  z-index: 2;
}
.cell-btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}
canvas.cloud {
  display: block;
  width: 100%;
  height: 250px;
}
.hover\:bg-\[var\(--line\)\]:hover {
  background-color: var(--line);
}
@media (min-width: 640px) {
  .sm\:flex {
    display: flex;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_370px\] {
    grid-template-columns: 1fr 370px;
  }
}
